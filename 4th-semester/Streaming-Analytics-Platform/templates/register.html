{% extends "base.html" %}
{% block title %}Register · Streaming Analytics{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card soft-card shadow-lg">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Create Account</h2>
                        <p class="text-muted">Join Streaming Analytics</p>
                    </div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="regUsername" class="form-label">Username</label>
                            <input type="text" class="form-control" id="regUsername" 
                                   placeholder="Choose username" required>
                            <div class="form-text">3-20 characters, letters and numbers only</div>
                        </div>

                        <div class="mb-3">
                            <label for="regEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="regEmail" 
                                   placeholder="your@email.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="regPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="regPassword" 
                                   placeholder="Create password" required>
                            <div class="form-text">At least 6 characters</div>
                        </div>

                        <div class="mb-3">
                            <label for="regConfirmPassword" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="regConfirmPassword" 
                                   placeholder="Confirm password" required>
                        </div>

                        <div class="d-grid gap-2 mb-3">
                            <button type="submit" class="btn btn-primary btn-lg">
                                Create Account
                            </button>
                        </div>

                        <div class="text-center">
                            <a href="{{ url_for('login_page') }}" class="text-decoration-none">
                                Already have an account? Sign In
                            </a>
                        </div>
                    </form>

                    <div id="registerMessage" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const username = document.getElementById('regUsername').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;
        const confirmPassword = document.getElementById('regConfirmPassword').value;
        const messageDiv = document.getElementById('registerMessage');
        
        // Basic validation
        if (password !== confirmPassword) {
            messageDiv.innerHTML = `
                <div class="alert alert-danger">
                    Passwords do not match
                </div>
            `;
            return;
        }
        
        if (password.length < 6) {
            messageDiv.innerHTML = `
                <div class="alert alert-danger">
                    Password must be at least 6 characters
                </div>
            `;
            return;
        }
        
        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, email, password, confirm_password: confirmPassword})
            });
            
            const data = await response.json();
            
            if (response.ok) {
                messageDiv.innerHTML = `
                    <div class="alert alert-success">
                        Registration successful! Logging you in...
                    </div>
                `;
                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);
            } else {
                messageDiv.innerHTML = `
                    <div class="alert alert-danger">
                        ${data.error || 'Registration failed'}
                    </div>
                `;
            }
        } catch (error) {
            messageDiv.innerHTML = `
                <div class="alert alert-danger">
                    Network error: ${error.message}
                </div>
            `;
        }
    });
</script>
{% endblock %}
